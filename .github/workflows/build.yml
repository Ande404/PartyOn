# Builds PartyOn and runs every test on Linux and Windows, plus a
# ThreadSanitizer job that checks the multi-client server for data races.
# Runs on every push (the result also shows on any open PR for that branch)
# and can be started by hand from the Actions tab ("Run workflow").

name: Build and test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    defaults:
      run:
        # Windows uses MSYS2 + MinGW-w64, the same setup the README describes
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install compiler and Python (Windows only)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python

      - name: Build server and client
        run: make

      - name: Unit tests
        run: make test

      - name: Protocol and multi-client tests against a running server
        run: |
          ./bin/partyon-server &
          SERVER_PID=$!
          sleep 2
          python3 tests/protocol_test.py
          python3 tests/concurrency_test.py
          python3 tests/load_test.py --clients 10,25 --commands 20
          kill $SERVER_PID || true

      - name: Persistence and restart tests (starts its own server)
        run: python3 tests/persistence_test.py

      - name: Show server log
        if: always()
        run: cat server.log || true

  # Data-race detection: the unit tests and a live server, both built with ThreadSanitizer
  tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      # Newer runner kernels randomize memory more than TSan supports
      - name: Allow ThreadSanitizer's memory layout
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Unit tests under ThreadSanitizer
        run: make tsan

      - name: Live multi-client tests against a ThreadSanitizer server
        run: |
          make BUILD_DIR=build-tsan BIN_DIR=bin-tsan \
            CXXFLAGS="-std=c++17 -Wall -Wextra -O1 -g -fsanitize=thread" \
            LDLIBS="-pthread -fsanitize=thread" bin-tsan/partyon-server
          ./bin-tsan/partyon-server 2> tsan-server.txt &
          SERVER_PID=$!
          sleep 2
          python3 tests/protocol_test.py
          python3 tests/concurrency_test.py
          kill -INT $SERVER_PID
          sleep 3
          if grep -q "WARNING: ThreadSanitizer" tsan-server.txt; then
            cat tsan-server.txt
            exit 1
          fi
          echo "No data races reported"
